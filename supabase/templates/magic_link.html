<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#0e1217;font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e7edf3">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#161c23;border:1px solid #2a333d;border-radius:14px">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b19cff">Byte Acres</p>
          <h1 style="margin:0 0 12px;font-size:22px;line-height:28px">Your sign-in link</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:22px;color:#9eabb8">
            Tap the button to sign in. Your farm and your code will be backed up from then on. The link works once and expires in an hour.
          </p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#b19cff;color:#170f33;font-weight:800;text-decoration:none">Sign in to Byte Acres</a>
          <p style="margin:24px 0 0;font-size:13px;line-height:19px;color:#7d8a97">
            Didn't ask for this? Ignore this email; nothing happens without the link.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
